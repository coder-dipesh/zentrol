{% extends "_auth_base.html" %}

{% block title %}Password updated | Zentrol{% endblock %}

{% block form_card %}
  <span class="eyebrow reveal-up">— done</span>
  <h1 class="display reveal-up d2 mt-4">
    Password<br/>
    <em>updated.</em>
  </h1>
  <p class="reveal-up d3 mt-5 max-w-[44ch] text-[15.5px] leading-relaxed text-ink2">
    Your new password is in. Sign in and you're back where you left off.
  </p>

  <a href="{% url 'login' %}" class="btn-primary reveal-up d4 mt-9" style="width:auto;">
    Sign in now
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
{% endblock %}
