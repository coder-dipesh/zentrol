    <text x="56" y="33" font-family="'Inter Tight', Inter, system-ui, sans-serif" font-size="15" fill="#3C3A35" font-weight="600">Camera on</text>
  </g>

  <g transform="translate(540,455)" filter="url(#softShadow)">
