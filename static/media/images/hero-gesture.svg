    <rect x="20" y="22" width="140" height="18" rx="9" fill="#D9D4C7"/>
    <circle cx="210" cy="78" r="46" fill="#1F8D87" opacity="0.45"/>
    <path d="M210 32 A46 46 0 0 1 256 78" fill="none" stroke="#1B1A18" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
