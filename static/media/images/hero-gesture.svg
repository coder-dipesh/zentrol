    <path d="M165 150 C210 120, 250 140, 250 190" fill="none" stroke="#176A66" stroke-width="22" stroke-linecap="round"/>
    <circle cx="252" cy="194" r="18" fill="#E8B09A"/>
  </g>

  <g transform="translate(470,215)" filter="url(#softShadow)">
    <rect width="320" height="210" rx="18" fill="#1B1A18"/>
    <rect x="14" y="14" width="292" height="164" rx="12" fill="#FBF9F4"/>
    <rect y="202" width="320" height="34" rx="16" fill="#1B1A18"/>
    <rect x="120" y="210" width="80" height="10" rx="5" fill="#3C3A35"/>
  </g>

  <g transform="translate(520,250)" filter="url(#softShadow)">
