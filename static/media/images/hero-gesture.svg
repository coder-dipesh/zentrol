<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="Gesture-controlled presentation illustration">
  <!-- Editorial tokens: paper #F4F1EA, sand #FBF9F4, ink #1B1A18, ink2 #3C3A35, accent #1F8D87, accent2 #176A66, line #D9D4C7 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F4"/>
      <stop offset="50%" stop-color="#F4F1EA"/>
      <stop offset="100%" stop-color="#EDE8DD"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B1A18" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="900" height="600" rx="32" fill="url(#bgGrad)" stroke="#D9D4C7" stroke-width="1"/>
  <circle cx="780" cy="110" r="90" fill="#1F8D87" opacity="0.08"/>
  <circle cx="130" cy="520" r="110" fill="#1B1A18" opacity="0.04"/>

  <g transform="translate(110,170) scale(1.15)">
