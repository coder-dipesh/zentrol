    <circle cx="186" cy="72" r="6" fill="#2a2925"/>
    <path d="M158 90 C170 102, 182 102, 194 90" fill="none" stroke="#B87A6A" stroke-width="6" stroke-linecap="round"/>
    <rect x="118" y="115" width="110" height="120" rx="24" fill="#1F8D87"/>
